name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Test (Group ${{ matrix.group }}/3)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        group: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.11

      - name: Restore pytest cache
        uses: actions/cache@v4
        with:
          path: .pytest_cache
          key: ${{ runner.os }}-pytest-${{ hashFiles('**/*.py') }}
          restore-keys: |
            ${{ runner.os }}-pytest-

      - name: Run Pytest
        env:
          BGG_USERNAME: dummy_user
          DB_FILE: testing.sqlite
        run: >
          uv run pytest
          -n auto
          --splits 3
          --group ${{ matrix.group }}
          --cov=api
          --cov=pages
          --cov=util
          --cov-report=xml
          --cov-report=term
          --junitxml=pytest-${{ matrix.group }}.xml

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.group }}
          path: |
            coverage.xml
            .coverage
          include-hidden-files: true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-results-${{ matrix.group }}
          path: pytest-${{ matrix.group }}.xml

  report:
    name: Report Coverage & Results
    needs: test
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Combine Coverage
        run: |
          pipx run coverage combine coverage-*/.coverage
          pipx run coverage xml -o combined-coverage.xml

      - name: Pytest coverage comment
        if: github.event_name == 'pull_request'
        uses: MishaKav/pytest-coverage-comment@main
        with:
          pytest-xml-coverage-path: combined-coverage.xml
          title: Code Coverage
          badge-title: Coverage
          hide-badge: false
          hide-report: false
          create-new-comment: false
          hide-comment: false
          report-only-changed-files: false

      - name: Pytest summary PR comment
        if: github.event_name == 'pull_request'
        uses: test-summary/action@v2
        with:
          paths: "pytest-results-*/*.xml"

      - name: Update Coverage Badge
        uses: tj-actions/coverage-badge-py@v2
        with:
          output: coverage.svg
          overwrite: true

      - name: Commit Coverage Badge
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update coverage badge"
          file_pattern: coverage.svg
