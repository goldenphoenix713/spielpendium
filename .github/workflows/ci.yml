name: CI

on:
  push:
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    name: Lint & Style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install markdownlint-cli
        run: |
          npm install markdownlint-cli
          echo "$(pwd)/node_modules/.bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: uv sync

      - name: Cache pre-commit
        uses: actions/cache@v5
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit
        run: uv run pre-commit run --all-files --show-diff-on-failure --color=always
        env:
          DB_FILE: testing.sqlite
          BGG_USERNAME: dummy_user

  test:
    name: Test (Group ${{ matrix.group }}/3)
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        group: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.11

      - name: Restore pytest cache
        uses: actions/cache@v5
        with:
          path: .pytest_cache
          key: ${{ runner.os }}-pytest-${{ hashFiles('**/*.py') }}
          restore-keys: |
            ${{ runner.os }}-pytest-

      - name: Run Pytest
        env:
          BGG_USERNAME: dummy_user
          DB_FILE: testing.sqlite
        run: >
          uv run pytest
          -n auto
          --splits 3
          --group ${{ matrix.group }}
          --cov=api
          --cov=pages
          --cov=util
          --cov-report=xml
          --cov-report=term
          --cov-fail-under=0
          --junitxml=pytest-${{ matrix.group }}.xml

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-${{ matrix.group }}
          path: |
            coverage.xml
            .coverage
          include-hidden-files: true

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pytest-results-${{ matrix.group }}
          path: pytest-${{ matrix.group }}.xml

  report:
    name: Report Coverage & Results
    needs: test
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v7

      - name: Combine Coverage
        run: |
          pipx run coverage combine coverage-*/.coverage
          pipx run coverage xml -o combined-coverage.xml
          pipx run coverage report --fail-under=90

      - name: Pytest coverage comment
        if: github.event_name == 'pull_request'
        uses: MishaKav/pytest-coverage-comment@main
        with:
          pytest-xml-coverage-path: combined-coverage.xml
          title: Code Coverage
          badge-title: Coverage
          hide-badge: false
          hide-report: false
          create-new-comment: false
          hide-comment: false
          report-only-changed-files: false

      - name: Pytest summary PR comment
        if: github.event_name == 'pull_request'
        uses: test-summary/action@v2
        with:
          paths: "pytest-results-*/*.xml"

      - name: Update Coverage Badge
        uses: tj-actions/coverage-badge-py@v2
        with:
          output: coverage.svg
          overwrite: true

      - name: Commit Coverage Badge
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: update coverage badge"
          file_pattern: coverage.svg
